<div class="listado">
  <div class="cabecera-listado"><h1>Clientes</h1><span class="recuento"></span></div>
  <div class="tabla-contenedor"></div>
</div>
<script>
  let principal = document.querySelector(".tabla-contenedor");

  fetch("api/api.php?bloque=tabla")
  .then(function(retorno){
    return retorno.json();
  })
  .then(function(datos){
    let clientes = datos.clientes;
    let tabla = document.createElement("table");
    let cabecera = document.createElement("tr");

    Object.keys(clientes[0]).forEach(function(clave){
      let th = document.createElement("th");
      th.textContent = clave;
      cabecera.appendChild(th);
    });

    tabla.appendChild(cabecera);

    clientes.forEach(function(cliente){
      let fila = document.createElement("tr");

      Object.values(cliente).forEach(function(valor){
        let celda = document.createElement("td");
        celda.textContent = valor;
        fila.appendChild(celda);
      });

      tabla.appendChild(fila);
    });

    principal.appendChild(tabla);
    document.querySelector(".recuento").textContent = clientes.length + " clientes";
  });
</script>
