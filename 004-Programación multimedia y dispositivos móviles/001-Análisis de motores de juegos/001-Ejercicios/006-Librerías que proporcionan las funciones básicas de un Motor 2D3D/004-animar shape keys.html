<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>GLB Shape Keys - Three.js</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<script type="module">

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';


    // ============================================================
    // SCENE
    // ============================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(
        0x111111
    );


    // ============================================================
    // CAMERA
    // ============================================================

    const camera = new THREE.PerspectiveCamera(
        20,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(
        0,
        0.8,
        1.3
    );
    camera.lookAt(0, 0.8, 0);


    // ============================================================
    // RENDERER
    // ============================================================

    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    document.body.appendChild(
        renderer.domElement
    );


    // ============================================================
    // LIGHTS
    // ============================================================

    const directionalLight =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    directionalLight.position.set(
        5,
        10,
        5
    );

    scene.add(
        directionalLight
    );


    const ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            0.45
        );

    scene.add(
        ambientLight
    );


    const luzRelleno = new THREE.DirectionalLight(0x9aa8bb, 0.6);
    luzRelleno.position.set(-3, 1, 3);
    scene.add(luzRelleno);

    // Muro detrás del avatar.
    const geometriaMuro = new THREE.PlaneGeometry(8, 6);
    const materialMuro = new THREE.MeshStandardMaterial({
        color: 0x17191d,
        roughness: 1,
        metalness: 0
    });
    const muro = new THREE.Mesh(geometriaMuro, materialMuro);
    muro.position.set(0, 0, -1.5);
    scene.add(muro);


    // ============================================================
    // SHAPE KEY MESHES
    // ============================================================

    const morphMeshes = [];


    // ============================================================
    // LOAD GLB
    // ============================================================

    const loader = new GLTFLoader();


    loader.load(

        'avatar_combinado.glb',


        // --------------------------------------------------------
        // SUCCESS
        // --------------------------------------------------------

        function(gltf) {

            console.log(
                "=========================================="
            );

            console.log(
                "GLB LOADED SUCCESSFULLY"
            );

            console.log(
                "=========================================="
            );


            console.log(
                "Complete GLTF object:",
                gltf
            );


            scene.add(
                gltf.scene
            );


            // ====================================================
            // INSPECT EVERYTHING
            // ====================================================

            gltf.scene.traverse(

                function(object) {

                    console.log(
                        "------------------------------------------"
                    );

                    console.log(
                        "Object:",
                        object.name || "(unnamed)"
                    );

                    console.log(
                        "Type:",
                        object.type
                    );


                    // We only care about meshes from here
                    if (!object.isMesh) {

                        return;

                    }


                    console.log(
                        "%cMESH DETECTED:",
                        "color:cyan;font-weight:bold",
                        object.name
                    );


                    // ============================================
                    // MORPH TARGET INFORMATION
                    // ============================================

                    console.log(
                        "morphTargetDictionary:",
                        object.morphTargetDictionary
                    );


                    console.log(
                        "morphTargetInfluences:",
                        object.morphTargetInfluences
                    );


                    console.log(
                        "geometry.morphAttributes:",
                        object.geometry.morphAttributes
                    );


                    // ============================================
                    // CHECK FOR SHAPE KEYS
                    // ============================================

                    if (
                        object.morphTargetDictionary &&
                        Object.keys(
                            object.morphTargetDictionary
                        ).length > 0
                    ) {

                        console.log(
                            "%c======================================",
                            "color:lime"
                        );

                        console.log(
                            "%cSHAPE KEYS FOUND",
                            "background:green;color:white;font-size:18px;padding:5px"
                        );

                        console.log(
                            "%c======================================",
                            "color:lime"
                        );


                        // Save this mesh for animation
                        morphMeshes.push(
                            object
                        );


                        // Print every Shape Key
                        Object.entries(
                            object.morphTargetDictionary
                        ).forEach(

                            function(entry) {

                                const name =
                                    entry[0];

                                const index =
                                    entry[1];


                                console.log(
                                    `%cShape Key: "${name}"   index: ${index}`,
                                    "color:lime;font-size:16px;font-weight:bold"
                                );

                            }

                        );


                    } else {

                        console.warn(
                            "NO SHAPE KEYS FOUND ON MESH:",
                            object.name
                        );

                    }

                }

            );


            // ====================================================
            // FINAL SUMMARY
            // ====================================================

            console.log(
                "=========================================="
            );

            console.log(
                "SHAPE KEY SUMMARY"
            );

            console.log(
                "=========================================="
            );


            if (morphMeshes.length === 0) {

                console.error(
                    "NO MORPH TARGETS / SHAPE KEYS FOUND IN GLB"
                );

            } else {

                console.log(
                    "Meshes containing Shape Keys:",
                    morphMeshes.length
                );


                morphMeshes.forEach(

                    function(mesh) {

                        console.log(
                            "Mesh:",
                            mesh.name
                        );

                        console.table(
                            mesh.morphTargetDictionary
                        );

                    }

                );

            }


            console.log(
                "=========================================="
            );

        },


        // --------------------------------------------------------
        // PROGRESS
        // --------------------------------------------------------

        function(xhr) {

            if (xhr.total > 0) {

                const percentage =
                    xhr.loaded /
                    xhr.total *
                    100;


                console.log(
                    "Loading GLB:",
                    percentage.toFixed(1) + "%"
                );

            }

        },


        // --------------------------------------------------------
        // ERROR
        // --------------------------------------------------------

        function(error) {

            console.error(
                "ERROR LOADING GLB:"
            );

            console.error(
                error
            );

        }

    );


    // ============================================================
    // SET SHAPE KEY
    // ============================================================

    function setShapeKey(
        name,
        value
    ) {

        morphMeshes.forEach(

            function(mesh) {

                const dictionary =
                    mesh.morphTargetDictionary;


                if (!dictionary) {

                    return;

                }


                const index =
                    dictionary[name];


                if (index === undefined) {

                    return;

                }


                mesh.morphTargetInfluences[index] =
                    value;

            }

        );

    }


    // ============================================================
    // RANDOM BLINK SYSTEM
    // ============================================================

    let blinking = false;

    let blinkStart = 0;

    let nextBlink =
        performance.now() +
        getRandomBlinkDelay();


    function getRandomBlinkDelay() {

        // Random delay between
        // 1.5 and 5 seconds

        return (
            1500 +
            Math.random() * 3500
        );

    }


    function updateBlink(now) {


        // --------------------------------------------------------
        // WAITING FOR NEXT BLINK
        // --------------------------------------------------------

        if (!blinking) {

            if (now >= nextBlink) {

                blinking = true;

                blinkStart = now;

            }

            return;

        }


        // --------------------------------------------------------
        // BLINK IN PROGRESS
        // --------------------------------------------------------

        const elapsed =
            now - blinkStart;


        const blinkDuration =
            200;


        const progress =
            elapsed / blinkDuration;


        // Blink finished
        if (progress >= 1) {

            setShapeKey(
                'ojos',
                0
            );


            blinking = false;


            nextBlink =
                now +
                getRandomBlinkDelay();


            return;

        }


        // --------------------------------------------------------
        // 0 -> 1 -> 0
        // --------------------------------------------------------

        let value;


        if (progress < 0.5) {

            // Closing eyes

            value =
                progress * 2;

        } else {

            // Opening eyes

            value =
                (1 - progress) * 2;

        }


        setShapeKey(
            'ojos',
            value
        );

    }


    // ============================================================
    // CLOCK
    // ============================================================

    const clock =
        new THREE.Clock();


    // ============================================================
    // ANIMATION LOOP
    // ============================================================

    function animate() {

        requestAnimationFrame(
            animate
        );


        const time =
            clock.getElapsedTime();


        // ========================================================
        // MOUTH "a"
        // ========================================================

        // sin() = -1 ... +1
        //
        // converted to:
        //
        // 0 ... 1

        const mouthValue =
            (
                Math.sin(
                    time * 4
                ) +
                1
            ) / 2;


        setShapeKey(
            'a',
            mouthValue
        );


        // ========================================================
        // EYES
        // ========================================================

        updateBlink(
            performance.now()
        );


        // ========================================================
        // RENDER
        // ========================================================

        renderer.render(
            scene,
            camera
        );

    }


    animate();


    // ============================================================
    // WINDOW RESIZE
    // ============================================================

    window.addEventListener(

        'resize',

        function() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }

    );

</script>

</body>
</html>
