<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GLB - Three.js</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>

    <!-- Tell the browser what "three" means -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

<script type="module">

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';


    // Scene
    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x111111);


    // Camera
    const camera = new THREE.PerspectiveCamera(
        20,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 2, 5);
    camera.lookAt(0, 0, 0);


    // Renderer
    const renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);


    // Light
    const light = new THREE.DirectionalLight(
        0xffffff,
        3
    );

    light.position.set(5, 10, 5);

    scene.add(light);

    const luzAmbiental = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(luzAmbiental);

    const luzRelleno = new THREE.DirectionalLight(0x9aa8bb, 0.6);
    luzRelleno.position.set(-3, 1, 3);
    scene.add(luzRelleno);

    // Muro detrás del avatar.
    const geometriaMuro = new THREE.PlaneGeometry(8, 6);
    const materialMuro = new THREE.MeshStandardMaterial({
        color: 0x17191d,
        roughness: 1,
        metalness: 0
    });
    const muro = new THREE.Mesh(geometriaMuro, materialMuro);
    muro.position.set(0, 0, -1.5);
    scene.add(muro);


    // Load GLB
    const loader = new GLTFLoader();

    loader.load(
        'avatar_combinado.glb',

        function(gltf) {

            scene.add(gltf.scene);

        }
    );


    // Animation loop
    function animate() {

        requestAnimationFrame(animate);

        renderer.render(
            scene,
            camera
        );
    }

    animate();

</script>

</body>
</html>
