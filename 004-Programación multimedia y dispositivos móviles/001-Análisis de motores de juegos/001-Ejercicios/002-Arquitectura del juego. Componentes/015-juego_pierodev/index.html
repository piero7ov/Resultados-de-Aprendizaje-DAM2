<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>MÁQUINA RÁPIDA</title>
    <link rel="stylesheet" href="css/estilo.css">
  </head>
  <body>
    <main>
      <canvas id="escenario" tabindex="0" aria-label="Juego de coches"></canvas>
      <div id="iu" hidden>
        <p id="estado_nivel">NIVEL 1 / 3</p>
        <div class="indicador">
          <span>META</span>
          <progress id="barra_progreso" value="0" max="100" aria-label="Progreso hasta la meta"></progress>
          <span id="numero_progreso">0%</span>
        </div>
        <div class="indicador">
          <span>ESCUDO</span>
          <progress id="barra_escudo" value="100" max="100" aria-label="Tiempo de escudo"></progress>
          <span id="numero_escudo">1</span>
        </div>
        <div class="indicador">
          <span>ENERGÍA</span>
          <progress id="barra_energia" value="100" max="100" aria-label="Energía del coche"></progress>
          <span id="numero_energia">100</span>
        </div>
        <p class="ayuda">Flechas: mover · Espacio: escudo</p>
      </div>
      <button id="volver_menu" type="button" hidden>VOLVER AL MENÚ</button>
      <div id="resultado" hidden>
        <section aria-labelledby="titulo_resultado">
          <h1 id="titulo_resultado">RESULTADO</h1>
          <p id="mensaje_resultado">Has llegado al otro lado de la carretera.</p>
          <button id="reiniciar" type="button">VOLVER A JUGAR</button>
        </section>
      </div>
      <div id="pantalla_inicio">
        <section aria-labelledby="titulo_juego">
          <h1 id="titulo_juego">MÁQUINA RÁPIDA</h1>
          <p>Cruza los tres niveles, esquiva el tráfico y administra tu escudo.</p>
          <p class="controles">Flechas para conducir · Espacio para activar el escudo</p>
          <div class="control_volumen">
            <label for="volumen_musica">VOLUMEN DE MÚSICA</label>
            <input id="volumen_musica" type="range" min="0" max="100" value="30">
            <output id="valor_volumen" for="volumen_musica">30 %</output>
          </div>
          <button id="jugar" type="button">JUGAR</button>
        </section>
        <p class="firma">bypierodev</p>
      </div>
      <audio id="musica_juego" src="recursos/audio/maquina_rapida_chill_loop.ogg" loop preload="auto"></audio>
    </main>
    <script src="js/util/colisiones.js"></script>
    <script src="js/nucleo/condicionesiniciales.js"></script>
    <script src="js/nucleo/recursos.js"></script>
    <script src="js/nucleo/entrada.js"></script>
    <script src="js/clases/Entidad.js"></script>
    <script src="js/clases/MarcaVial.js"></script>
    <script src="js/clases/Escudo.js"></script>
    <script src="js/clases/Coche.js"></script>
    <script src="js/clases/Enemigo.js"></script>
    <script src="js/clases/Obstaculo.js"></script>
    <script src="js/nucleo/inicio.js"></script>
    <script src="js/nucleo/ganar.js"></script>
    <script src="js/nucleo/perder.js"></script>
    <script src="js/nucleo/menu.js"></script>
    <script src="js/nucleo/bucle.js"></script>
    <script>
      mostrarMenu();
    </script>
  </body>
</html>
