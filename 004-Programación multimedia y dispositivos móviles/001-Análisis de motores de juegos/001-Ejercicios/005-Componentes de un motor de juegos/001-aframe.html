<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hello World - A-Frame</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- Caja -->
        <a-box position="-1 0.5 -3" rotation="0 45 0" color="#ff0000" scale="0.2 0.2 0.2">
        </a-box>

        <!-- Esfera -->
        <a-sphere position="0 1.25 -5" radius="0.5" color="#00ff00">
        </a-sphere>

        <!-- Cilindro -->
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D">
        </a-cylinder>

        <!-- Suelo -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#7BC8A4">
        </a-plane>

        <!-- Cielo -->
        <a-sky color="#ECECEC"></a-sky>

        <!-- Texto -->
        <a-text value="Hello World!" position="-1.5 2.5 -4" color="#222222" width="6">
        </a-text>

    </a-scene>

</body>
</html>
