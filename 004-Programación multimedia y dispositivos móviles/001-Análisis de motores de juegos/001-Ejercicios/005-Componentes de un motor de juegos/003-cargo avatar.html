<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar avatar - A-Frame</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <a-assets>
            <a-asset-item id="avatar" src="avatar_detallado.glb"></a-asset-item>
        </a-assets>

        <!-- Avatar -->
        <a-entity gltf-model="#avatar" position="0 0.95 -4" rotation="0 0 0" scale="1 1 1">
        </a-entity>

        <!-- Suelo -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#AAAAAA">
        </a-plane>

        <!-- Cielo -->
        <a-sky color="#ECECEC"></a-sky>

    </a-scene>

</body>
</html>
