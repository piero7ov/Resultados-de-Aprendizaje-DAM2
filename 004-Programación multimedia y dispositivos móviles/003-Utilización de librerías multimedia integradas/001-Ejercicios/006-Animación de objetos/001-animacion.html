<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    #contenedor{
      width:50px;
      height:50px;
      border-radius:50%;
      background:green;
      position:relative;
      animation:muevemueve 10s linear infinite;
    }

    @keyframes muevemueve{
      0%{left:135px;top:15px;}
      25%{left:235px;top:115px;}
      50%{left:135px;top:215px;}
      75%{left:35px;top:115px;}
      100%{left:135px;top:15px;}
    }
  </style>
</head>
<body>
  <div id="contenedor"></div>
</body>
</html>
