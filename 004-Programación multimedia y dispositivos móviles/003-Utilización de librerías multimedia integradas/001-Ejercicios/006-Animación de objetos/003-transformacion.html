<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    #contenedor{
      width:50px;
      height:50px;
      border-radius:50%;
      background:violet;
      position:relative;
      animation:muevemueve 10s linear infinite;
    }

    @keyframes muevemueve{
      0%{left:135px;top:15px;transform:scale(1);background:violet;}
      25%{left:235px;top:115px;transform:scale(1.5);background:orange;}
      50%{left:135px;top:215px;transform:scale(1);background:#800020;}
      75%{left:35px;top:115px;transform:scale(1.5);background:pink;}
      100%{left:135px;top:15px;transform:scale(1);background:violet;}
    }
  </style>
</head>
<body>
  <div id="contenedor"></div>
</body>
</html>
