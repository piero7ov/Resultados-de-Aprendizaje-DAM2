<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERIN | Acceso</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/componentes.js" defer></script>
    <script src="js/mejoras.js" defer></script>
</head>
<body class="pagina-login">
    <main class="login-contenedor">
        <section class="login-identidad">
            <a class="logotipo" href="index.html" aria-label="ERIN, inicio">ER<span class="letra-i">I</span>N</a>
            <p>Ecosistema de Recursos, Información y Negocio</p>
            <strong>Tu información conectada en un único espacio.</strong>
        </section>

        <section class="login-panel" aria-labelledby="titulo-login">
            <div>
                <span class="estado-panel">Acceso ERIN</span>
                <h1 id="titulo-login">Iniciar sesión</h1>
                <p>Introduce tus credenciales para acceder al espacio de trabajo.</p>
            </div>

            <form class="formulario-login" id="formulario-login">
                <label>
                    <span>Correo electrónico</span>
                    <input name="correo" type="email" autocomplete="username" required>
                </label>
                <label>
                    <span>Contraseña</span>
                    <input name="contrasena" type="password" autocomplete="current-password" required>
                </label>
                <label class="campo-check">
                    <input name="mantener" type="checkbox">
                    <span>Mantener la sesión iniciada</span>
                </label>
                <button class="boton" type="submit">Entrar</button>
            </form>

            <a class="enlace-regreso" href="index.html">Volver a la aplicación</a>
        </section>
    </main>

    <div id="contenedor-toasts" class="contenedor-toasts" aria-live="polite"></div>
    <div id="templates" hidden></div>
</body>
</html>
