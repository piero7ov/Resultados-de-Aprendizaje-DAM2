<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asistente con Ollama</title>
    <style>
      body{
        font-family:Arial,sans-serif;
        margin:0;
      }

      #chat{
        position:fixed;
        right:30px;
        bottom:105px;
        width:350px;
        height:450px;
        max-width:calc(100vw - 60px);
        max-height:calc(100vh - 125px);
        background:#f5f5f5;
        border-radius:15px;
        box-shadow:0 5px 30px #0004;
        display:none;
        flex-direction:column;
        overflow:hidden;
      }

      #cabecera{
        background:dodgerblue;
        color:white;
        padding:15px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-weight:bold;
      }

      #cerrar{
        border:0;
        background:none;
        color:white;
        font-size:24px;
        cursor:pointer;
      }

      #conversacion{
        flex:1;
        padding:20px;
        display:flex;
        flex-direction:column;
        gap:15px;
        overflow-y:auto;
      }

      .bocadillo{
        padding:10px 15px;
        border-radius:18px;
        max-width:75%;
        line-height:1.4;
        overflow-wrap:anywhere;
      }

      .yo{
        background:dodgerblue;
        color:white;
        align-self:flex-end;
        border-bottom-right-radius:4px;
      }

      .maquina{
        background:white;
        align-self:flex-start;
        border-bottom-left-radius:4px;
        box-shadow:0 2px 8px #0002;
      }

      #microfono{
        position:fixed;
        right:30px;
        bottom:30px;
        width:60px;
        height:60px;
        border:0;
        border-radius:50%;
        background:dodgerblue;
        color:white;
        font-size:28px;
        cursor:pointer;
        box-shadow:0 4px 15px #0004;
      }

      #microfono.escuchando{
        animation:pulsar 1s infinite;
      }

      @keyframes pulsar{
        50%{
          box-shadow:0 0 0 12px #1e90ff44;
          transform:scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat">
      <div id="cabecera">
        <span>Asistente</span>
        <button id="cerrar" onclick="cerrarChat()" aria-label="Cerrar">×</button>
      </div>
      <div id="conversacion">
        <div class="bocadillo maquina">Hola, pulsa el micrófono y háblame.</div>
      </div>
    </div>

    <button id="microfono" onclick="escuchar()" aria-label="Escuchar">🎤</button>

    <script>
      let historial = [];
      let esperando = false;

      function bocadillo(texto, quien){
        let mensaje = document.createElement("div");
        mensaje.classList.add("bocadillo", quien);
        mensaje.textContent = texto;

        let conversacion = document.querySelector("#conversacion");
        conversacion.appendChild(mensaje);
        conversacion.scrollTop = conversacion.scrollHeight;
        return mensaje;
      }

      function escuchar(){
        document.querySelector("#chat").style.display = "flex";
        if(esperando){
          return;
        }

        let Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Reconocimiento){
          bocadillo("Este navegador no permite reconocer la voz.", "maquina");
          return;
        }

        let reconocimiento = new Reconocimiento();
        reconocimiento.lang = "es-ES";
        esperando = true;

        reconocimiento.onstart = function(){
          document.querySelector("#microfono").classList.add("escuchando");
        };

        reconocimiento.onend = function(){
          document.querySelector("#microfono").classList.remove("escuchando");
        };

        reconocimiento.onerror = function(evento){
          esperando = false;
          document.querySelector("#microfono").classList.remove("escuchando");
          bocadillo("No he podido reconocer la voz: " + evento.error, "maquina");
        };

        reconocimiento.onresult = function(evento){
          let texto = evento.results[0][0].transcript;
          bocadillo(texto, "yo");
          let pensando = bocadillo("Pensando...", "maquina");

          fetch("ollama.php", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({mensaje:texto, historial:historial})
          })
          .then(respuesta => {
            if(!respuesta.ok){
              throw new Error("HTTP " + respuesta.status);
            }
            return respuesta.json();
          })
          .then(datos => {
            pensando.remove();
            let respuesta = datos.respuesta;
            if(!respuesta){
              throw new Error("Respuesta vacía");
            }

            bocadillo(respuesta, "maquina");
            historial.push({role:"user", content:texto});
            historial.push({role:"assistant", content:respuesta});
            historial = historial.slice(-10);

            let mensaje = new SpeechSynthesisUtterance(respuesta);
            mensaje.lang = "es-ES";
            speechSynthesis.cancel();
            speechSynthesis.speak(mensaje);
          })
          .catch(error => {
            pensando.remove();
            console.error(error);
            bocadillo("No he podido conectar con Ollama.", "maquina");
          })
          .finally(() => {
            esperando = false;
          });
        };

        try{
          reconocimiento.start();
        } catch(error){
          esperando = false;
          bocadillo("No he podido iniciar el micrófono.", "maquina");
        }
      }

      function cerrarChat(){
        document.querySelector("#chat").style.display = "none";
        speechSynthesis.cancel();
      }
    </script>
  </body>
</html>
