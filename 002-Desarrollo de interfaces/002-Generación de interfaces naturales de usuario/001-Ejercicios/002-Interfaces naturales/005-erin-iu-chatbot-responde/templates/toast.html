<template id="template-toast">
    <article class="toast" role="status">
        <span class="toast-icono" aria-hidden="true"></span>
        <div>
            <strong class="toast-titulo"></strong>
            <p class="toast-mensaje"></p>
        </div>
        <button class="toast-cerrar" type="button" aria-label="Cerrar mensaje">×</button>
    </article>
</template>
