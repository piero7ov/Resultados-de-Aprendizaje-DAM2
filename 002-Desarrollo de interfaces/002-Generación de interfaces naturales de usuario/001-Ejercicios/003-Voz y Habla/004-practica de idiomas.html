<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Práctica de idiomas</title>
    <style>
      body{
        font-family:Arial,sans-serif;
      }

      #chat{
        position:fixed;
        right:30px;
        bottom:105px;
        width:350px;
        height:450px;
        background:#f5f5f5;
        border-radius:15px;
        box-shadow:0 5px 30px #0004;
        display:none;
        flex-direction:column;
        overflow:hidden;
      }

      #cabecera{
        background:dodgerblue;
        color:white;
        padding:15px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        font-weight:bold;
      }

      #cerrar{
        border:0;
        background:none;
        color:white;
        font-size:24px;
        cursor:pointer;
      }

      #conversacion{
        flex:1;
        padding:20px;
        display:flex;
        flex-direction:column;
        gap:15px;
        overflow-y:auto;
      }

      .bocadillo{
        padding:10px 15px;
        border-radius:18px;
        max-width:75%;
        line-height:1.4;
      }

      .yo{
        background:dodgerblue;
        color:white;
        align-self:flex-end;
        border-bottom-right-radius:4px;
      }

      .maquina{
        background:white;
        align-self:flex-start;
        border-bottom-left-radius:4px;
        box-shadow:0 2px 8px #0002;
      }

      #microfono{
        position:fixed;
        right:30px;
        bottom:30px;
        width:60px;
        height:60px;
        border:0;
        border-radius:50%;
        background:dodgerblue;
        color:white;
        font-size:28px;
        cursor:pointer;
        box-shadow:0 4px 15px #0004;
      }

      #microfono.escuchando{
        animation:pulsar 1s infinite;
      }

      @keyframes pulsar{
        50%{
          box-shadow:0 0 0 12px #1e90ff44;
          transform:scale(1.1);
        }
      }
    </style>
  </head>
  <body>
    <div id="chat">
      <div id="cabecera">
        <span>Práctica de idiomas</span>
        <button id="cerrar" onclick="cerrarChat()" aria-label="Cerrar">×</button>
      </div>
      <div id="conversacion">
        <div class="bocadillo maquina">Di una frase: «hola», «buenos días», «gracias», «cómo estás» o «hasta luego».</div>
      </div>
    </div>

    <button id="microfono" onclick="escuchar()" aria-label="Escuchar">🎤</button>

    <script>
      let traducciones = {
        "hola": "Hello",
        "buenos días": "Good morning",
        "gracias": "Thank you",
        "cómo estás": "How are you?",
        "hasta luego": "See you later"
      };

      function bocadillo(texto, quien){
        let mensaje = document.createElement("div");
        mensaje.classList.add("bocadillo", quien);
        mensaje.textContent = texto;

        let conversacion = document.querySelector("#conversacion");
        conversacion.appendChild(mensaje);
        conversacion.scrollTop = conversacion.scrollHeight;
      }

      function escuchar(){
        document.querySelector("#chat").style.display = "flex";

        let Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Reconocimiento){
          bocadillo("Este navegador no permite reconocer la voz.", "maquina");
          return;
        }

        let reconocimiento = new Reconocimiento();
        reconocimiento.lang = "es-ES";

        reconocimiento.onstart = function(){
          document.querySelector("#microfono").classList.add("escuchando");
        };

        reconocimiento.onend = function(){
          document.querySelector("#microfono").classList.remove("escuchando");
        };

        reconocimiento.onerror = function(){
          document.querySelector("#microfono").classList.remove("escuchando");
        };

        reconocimiento.onresult = function(evento){
          let texto = evento.results[0][0].transcript;
          bocadillo(texto, "yo");

          let frase = texto.toLowerCase().trim().replace(/[¡!¿?.]+$/g, "").trim();
          let respuesta = traducciones[frase];

          if(!respuesta){
            bocadillo("Aún no tengo preparada la traducción de esa frase.", "maquina");
            return;
          }

          bocadillo(respuesta, "maquina");

          let mensaje = new SpeechSynthesisUtterance(respuesta);
          mensaje.lang = "en-US";

          let voces = speechSynthesis.getVoices();
          let voz = voces.find(v => v.lang === "en-US");
          if(voz){
            mensaje.voice = voz;
          }

          speechSynthesis.speak(mensaje);
        };

        reconocimiento.start();
      }

      function cerrarChat(){
        document.querySelector("#chat").style.display = "none";
      }
    </script>
  </body>
</html>
