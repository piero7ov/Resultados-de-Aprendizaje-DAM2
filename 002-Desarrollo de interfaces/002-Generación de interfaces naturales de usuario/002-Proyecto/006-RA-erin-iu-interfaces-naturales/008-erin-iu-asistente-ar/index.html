<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ERIN | Chatbot responde</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/preferencias-tema.js"></script>
    <script src="js/componentes.js" defer></script>
    <script src="js/tabla-controles.js" defer></script>
    <script src="js/interacciones.js" defer></script>
    <script src="js/editor-producto.js" defer></script>
    <script src="js/chatbot.js" defer></script>
    <script src="js/camara-gestos.js" defer></script>
</head>
<body class="erin">
    <!-- Cabecera corporativa, herramientas y datos del usuario. -->
    <header>
        <div class="marca">
            <a class="logotipo" href="#productos" aria-label="ERIN, inicio">ER<span class="letra-identidad">I</span>N</a>
            <small>Ecosistema de Recursos,<br>Información y Negocio</small>
        </div>
        <div class="herramientas">
            <label for="buscar">Buscar</label>
            <input class="buscador" id="buscar" type="search" placeholder="Buscar productos…">
            <button class="boton" type="button">Herramientas</button>
            <button class="boton boton-secundario" id="abrir-camara" type="button" aria-controls="panel-camara" aria-expanded="false">Cámara</button>
            <button class="boton" id="nuevo-producto" type="button">+ Nuevo</button>
        </div>
        <div class="usuario" data-source="data/usuario.json"></div>
    </header>

    <!-- Las dos columnas laterales conservan la estructura de 005-redimensionable. -->
    <main>
        <nav class="navegacion" data-source="data/menu.json" aria-label="Áreas de gestión"></nav>
        <!-- Cada separador redimensiona la columna situada inmediatamente a su izquierda. -->
        <div class="separador" role="separator" aria-orientation="vertical" aria-label="Redimensionar navegación" data-minimo="150" data-maximo="300"></div>

        <section class="elementos" data-source="data/entidades.json" aria-label="Elementos"></section>
        <div class="separador" role="separator" aria-orientation="vertical" aria-label="Redimensionar elementos" data-minimo="180" data-maximo="360"></div>

        <!-- Escenario principal: la tabla se genera desde productos.json. -->
        <section class="escenario" id="productos" aria-labelledby="titulo-listado">
            <div class="titulo-listado">
                <div>
                    <h1 id="titulo-listado">Catálogo de productos</h1>
                    <p>Información comercial y disponibilidad</p>
                </div>

                <form class="panel-filtros" id="panel-filtros" hidden>
                    <label>
                        <span>Categoría</span>
                        <select id="filtro-categoria">
                            <option value="">Todas</option>
                        </select>
                    </label>
                    <label>
                        <span>Disponibilidad</span>
                        <select id="filtro-disponibilidad">
                            <option value="">Todos</option>
                            <option value="si">Disponibles</option>
                            <option value="no">No disponibles</option>
                        </select>
                    </label>
                    <button class="boton boton-secundario" id="limpiar-filtros" type="button">Limpiar</button>
                    <p id="resultados-filtro" role="status" aria-live="polite"></p>
                </form>

                <button class="boton" id="mostrar-filtros" type="button" aria-expanded="false" aria-controls="panel-filtros">Filtrar</button>
            </div>

            <div class="tabla">
                <table data-source="data/productos.json"></table>
            </div>
        </section>
    </main>

    <dialog class="panel-lateral-erin" id="panel-nuevo-producto" aria-labelledby="titulo-nuevo-producto">
        <div class="redimensionar-panel" id="redimensionar-producto" role="separator" aria-orientation="vertical" aria-label="Redimensionar panel lateral" aria-valuemin="320" aria-valuemax="720" aria-valuenow="440" tabindex="0"></div>
        <div class="cabecera-dialogo">
            <div>
                <small>CATÁLOGO</small>
                <h2 id="titulo-nuevo-producto">Nuevo producto</h2>
            </div>
            <button class="boton boton-secundario cerrar-dialogo" id="cerrar-nuevo-producto" type="button" aria-label="Cerrar panel lateral">×</button>
        </div>
        <form class="formulario-panel" id="formulario-nuevo-producto">
            <div class="campos-producto" id="campos-nuevo-producto"></div>
            <div class="acciones-dialogo">
                <button class="boton" id="guardar-producto" type="submit">Crear producto</button>
                <button class="boton boton-secundario" id="cancelar-nuevo-producto" type="button">Cancelar</button>
            </div>
        </form>
    </dialog>

    <aside class="panel-camara" id="panel-camara" aria-label="Control por cámara" hidden>
        <div class="cabecera-camara">
            <h2>Control por cámara</h2>
            <button class="boton boton-secundario cerrar-dialogo" id="cerrar-camara" type="button" aria-label="Cerrar cámara">×</button>
        </div>
        <div class="vista-camara">
            <video id="video-camara" autoplay muted playsinline aria-label="Vista de la cámara"></video>
            <canvas id="puntos-mano" width="640" height="480" aria-hidden="true"></canvas>
            <div class="tarjeta-ar" id="tarjeta-ar" aria-hidden="true" hidden>
                <small>ERIN · ASISTENTE</small>
                <strong id="asistente-ar"></strong>
                <span id="peticion-ar"></span>
            </div>
        </div>
        <p id="estado-camara" role="status" aria-live="polite"></p>
    </aside>

    <aside class="asistente-flotante" id="asistente-flotante" aria-label="Asistente local">
        <div class="cabecera-asistente" id="cabecera-asistente">
            <strong>Asistente local</strong>
            <div class="controles-asistente">
                <button class="mover-asistente" id="mover-asistente" type="button" aria-label="Mover asistente" title="Arrastra o usa las flechas para mover">⠿</button>
                <button class="minimizar-asistente" id="minimizar-asistente" type="button" aria-label="Minimizar asistente" title="Minimizar asistente" aria-expanded="true" aria-controls="formulario-asistente"><span class="simbolo-minimizar">−</span><span class="simbolo-erin letra-identidad" aria-hidden="true">I</span></button>
            </div>
        </div>
        <form class="formulario-asistente" id="formulario-asistente">
            <div class="entrada-asistente">
                <textarea id="mensaje-asistente" rows="1" aria-label="Mensaje para Ollama" placeholder="Escribe una petición..."></textarea>
                <div class="acciones-asistente">
                    <button class="boton boton-secundario" id="microfono-asistente" type="button" aria-label="Dictar mensaje" title="Dictar mensaje">🎙</button>
                    <button class="boton" id="enviar-asistente" type="submit" aria-label="Enviar mensaje" title="Enviar mensaje">➤</button>
                </div>
            </div>
            <label class="opcion-voz" for="leer-respuestas"><input id="leer-respuestas" type="checkbox" role="switch"><span class="interruptor-voz" aria-hidden="true"></span><span>Leer respuestas</span></label>
        </form>
        <p class="estado-asistente" id="estado-asistente" role="status" aria-live="polite"></p>
    </aside>

    <div id="contenedor-toasts" class="contenedor-toasts" role="region" aria-label="Notificaciones" aria-live="polite" aria-atomic="false"></div>
    <!-- Aquí se insertan los templates externos antes de clonar sus componentes. -->
    <div id="templates" hidden></div>
</body>
</html>
